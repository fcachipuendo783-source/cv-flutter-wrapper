# Limita el heap de Java a 1536 MiB para reducir la presión sobre
# los 3.6 GiB disponibles en Docker.
# También limita la memoria de clases y la caché de código compilado.
# Conserva el volcado de diagnóstico si Java se queda sin memoria.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Ejecuta como máximo un trabajador para reducir tareas simultáneas.
org.gradle.workers.max=1

# Desactiva la ejecución paralela entre proyectos de Gradle.
org.gradle.parallel=false

# Conserva AndroidX y las opciones del proyecto generado por Flutter.
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false